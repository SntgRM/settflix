server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback a index.html para que React Router maneje las rutas
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }
}
